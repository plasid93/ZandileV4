<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10141c">
<title>Refreshing Nannybear</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#10141c;color:#f3f2ed;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}.panel{max-width:420px;text-align:center;background:#191f2a;border:1px solid #30394a;border-radius:18px;padding:30px 24px}.mark{width:44px;height:44px;margin:0 auto 18px;border:4px solid #a8bca0;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}h1{font-size:1.3rem;margin:0 0 10px}p{color:#c9d0dd;line-height:1.55;margin:0}@keyframes spin{to{transform:rotate(360deg)}}</style>
</head>
<body>
<main class="panel">
<div class="mark" aria-hidden="true"></div>
<h1>Refreshing Nannybear</h1>
<p id="status">Removing an outdated offline copy, then loading the latest version…</p>
</main>
<script>
(async()=>{
  try{
    if('serviceWorker'in navigator){
      const registrations=await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(registration=>registration.unregister()));
    }
    if('caches'in window){
      const names=await caches.keys();
      await Promise.all(names.map(name=>caches.delete(name)));
    }
    document.getElementById('status').textContent='Updated. Opening the latest Nannybear…';
  }catch(error){
    document.getElementById('status').textContent='Opening the latest Nannybear…';
  }
  location.replace('./?refreshed=19');
})();
</script>
</body>
</html>
